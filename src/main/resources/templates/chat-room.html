<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chat Room Test</title>
    <style>
        .chat-container {
            width: 600px;
            margin: 30px auto;
            border: 1px solid #ddd;
            box-shadow: 1px 3px 5px rgba(0,0,0,0.2);
            padding: 20px;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            margin: 10px 0;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .sent {
            background-color: #e3f2fd;
            margin-left: auto;
            align-self: flex-end;
            text-align: right;
        }
        .received {
            background-color: #f5f5f5;
            margin-right: auto;
            align-self: flex-start;
        }
        .message-content {
            padding: 8px;
            border-radius: 8px;
        }
        .sender-info {
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 0.8em;
            color: #666;
        }
        .content-text {
            line-height: 1.4;
            margin: 5px 0;
            word-break: break-word;
        }
        .message-info {
            margin-top: 4px;
            text-align: right;
            font-size: 0.75em;
            color: #888;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .connected {
            background-color: #c8e6c9;
        }
        .disconnected {
            background-color: #ffcdd2;
        }
        .input-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .input-container input {
            flex: 1;
            padding: 8px;
        }
        .error-message {
            color: white;
            background-color: #ff4444;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <h2>Chat Room <span th:text="${roomId}"></span></h2>
    <div>
        <input type="text" id="token" placeholder="Enter JWT Token" style="width: 100%"/>
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    <div id="messages" class="messages"></div>
    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Type a message..."/>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:inline="javascript">
    const roomId = [[${roomId}]];
    let stompClient = null;
    let currentProfileId = null;
    let serverAddress;

    // 페이지 로드 시 서버 주소 가져오기
    fetch('/api/v1/test/config')
        .then(response => response.json())
        .then(config => {
            serverAddress = config.serverAddress;
            console.log('Server address configured:', serverAddress);
        })
        .catch(error => {
            console.error('Failed to fetch server config:', error);
            showError('서버 설정을 가져오는데 실패했습니다.');
        });

    function connect() {
        const token = document.getElementById('token').value;
        console.log('Attempting to connect with token:', token);

        const baseUrl = window.location.hostname === 'localhost'
            ? ''
            : `http://${serverAddress}:${window.location.port}`;

        const socketUrl = `${baseUrl}/api/v1/ws-chat?token=${encodeURIComponent(token)}`;

        const sockJsOptions = {
            transports: ['websocket'],
            websocket: true,
            debug: true
        };

        try {
            const socket = new SockJS(socketUrl, null, sockJsOptions);
            stompClient = Stomp.over(socket);
            stompClient.reconnect_delay = 5000;

            const headers = {
                'Authorization': `Bearer ${token}`
            };

            console.log('Connecting with headers:', headers);

            stompClient.connect(headers,
                function(frame) {
                    console.log('Connected:', frame);
                    if (frame.headers['user-name']) {
                        currentProfileId = parseInt(frame.headers['user-name']);
                        console.log('Set currentProfileId:', currentProfileId);
                    } else {
                        console.error('No profile ID in frame headers');
                    }
                    updateConnectionStatus(true);

                    stompClient.subscribe(`/topic/chat/${roomId}`, function(message) {
                        console.log('Received raw message:', message);
                        try {
                            const parsedMessage = JSON.parse(message.body);
                            console.log('Parsed message:', parsedMessage);
                            showMessage(parsedMessage);
                        } catch (e) {
                            console.error('Error parsing message:', e);
                            showError('메시지 파싱 오류: ' + e.message);
                        }
                    });
                },
                function(error) {
                    console.error('Connection error:', error);
                    console.error('Error details:', error.headers, error.body);
                    updateConnectionStatus(false);
                    showError('Connection failed: ' + error);
                }
            );
        } catch (error) {
            console.error('SockJS creation error:', error);
            showError('Failed to create WebSocket connection: ' + error.message);
        }
    }

    function sendMessage() {
        const content = document.getElementById('messageInput').value.trim();
        if (content && stompClient) {
            const message = {
                content: content,
                chatRoomId: roomId,
                fromProfileId: currentProfileId,
                timestamp: new Date().toISOString()
            };

            console.log('Sending message with currentProfileId:', currentProfileId);
            console.log('Full message object:', message);
            stompClient.send(`/app/chat/${roomId}/sendMessage`, {}, JSON.stringify(message));
            document.getElementById('messageInput').value = '';
        }
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
            updateConnectionStatus(false);
            currentProfileId = null;
        }
    }

    function showMessage(message) {
        console.log('Raw received message:', message);
        console.log('currentProfileId:', currentProfileId);
        console.log('message.fromProfileId:', message.fromProfileId);

        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        const isMyMessage = message.fromProfileId === currentProfileId;

        messageElement.className = `message ${isMyMessage ? 'sent' : 'received'}`;

        const html = `
           <div class="message-content">
               <div class="sender-info">
                   ${isMyMessage ? '나' : `상대방 (ID: ${message.fromProfileId})`}
               </div>
               <div class="content-text">
                   ${message.content}
               </div>
               <div class="message-info">
                   ${new Date(message.sendAt).toLocaleString('ko-KR', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
        })}
               </div>
           </div>
       `;

        messageElement.innerHTML = html;
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showError(error) {
        const messagesDiv = document.getElementById('messages');
        const errorElement = document.createElement('div');
        errorElement.className = 'error-message';

        const errorTime = new Date().toLocaleTimeString();
        errorElement.textContent = `[${errorTime}] 오류: ${error}`;

        messagesDiv.appendChild(errorElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateConnectionStatus(connected) {
        const statusDiv = document.getElementById('connectionStatus');
        statusDiv.textContent = connected ? 'Connected' : 'Disconnected';
        statusDiv.className = `status ${connected ? 'connected' : 'disconnected'}`;
    }

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
